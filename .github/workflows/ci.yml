name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A pull request only needs its newest commit checked, so its older run is cancelled. A push to
# dev or main is checked in full; newer pushes queue behind it and only the latest of them stays
# queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The documentation is not checked here: check:docs runs in the git hooks (.githooks/), see
# docs/testing/profiles.md.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Node 24 bundles npm 11, but engines.npm requires 12.
      - name: Update npm
        run: npm i -g npm@12

      # npm otherwise resolves optional peer dependencies of the bundled Tailwind WASM fallback
      # against the registry and rejects its own lock file as out of sync.
      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint:ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the production bundle itself (webServer in playwright.config.ts), so together with
      # the type check above it covers `npm run build`, and the job has no build step of its own.
      - name: End-to-end tests
        run: npm run test:e2e

  # The only check that the app still assembles for the platform it ships on, and that Gradle can
  # read the version out of package.json. Kept as a separate job: it needs a JDK and the Android
  # SDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Node 24 bundles npm 11, but engines.npm requires 12.
      - name: Update npm
        run: npm i -g npm@12

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci --legacy-peer-deps

      - name: Web build
        run: npm run build-only

      - name: Capacitor sync
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
